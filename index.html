<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avto Hamroh</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 5px; }
        .desc { text-align: center; font-size: 12px; color: #666; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        .result { background: #e8f0fe; padding: 15px; border-radius: 10px; text-align: center; margin-top: 20px; font-size: 22px; font-weight: bold; color: #1a73e8; }
        .btn { background: #28a745; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; margin-top: 20px; cursor: pointer; font-size: 18px; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
        .check-item { display: flex; align-items: center; gap: 10px; font-weight: normal; margin-top: 10px; }
        .check-item input { width: auto; margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Avto Hamroh</h2>
    <div class="desc">Avtosug'urta va Yevroprotokol yordamchisi</div>
    
    <label>Avtomobil turi:</label>
    <select id="carType" onchange="calc()">
        <option value="192000">Yengil avtomobil</option>
        <option value="336000">Yuk avtomobili</option>
    </select>

    <label>Hudud:</label>
    <select id="region" onchange="calc()">
        <option value="1">Toshkent sh. va viloyati</option>
        <option value="0.83">Boshqa viloyatlar</option>
    </select>

    <div class="result" id="res">192 000 so'm</div>

    <hr>
    <h3 style="margin-bottom:10px;">Yevroprotokol:</h3>
    <div class="check-item"><input type="checkbox" id="c1"> Jarohatlanganlar yo'q</div>
    <div class="check-item"><input type="checkbox" id="c2"> Faqat 2 ta mashina</div>
    <div class="check-item"><input type="checkbox" id="c3"> Haydovchilar kelishgan</div>
    
    <button class="btn" onclick="checkEuro()">Tekshirish</button>
</div>

<script>
    function calc() {
        let base = document.getElementById('carType').value;
        let region = document.getElementById('region').value;
        let final = Math.round(base * region);
        document.getElementById('res').innerText = final.toLocaleString() + " so'm";
    }

    function checkEuro() {
        const c1 = document.getElementById('c1').checked;
        const c2 = document.getElementById('c2').checked;
        const c3 = document.getElementById('c3').checked;
        
        if(c1 && c2 && c3) {
            alert("Siz Yevroprotokol tuzishingiz mumkin!");
        } else {
            alert("DIQQAT: YHXB (GAI) xodimini chaqiring!");
        }
    }
</script>

</body>
</html>
